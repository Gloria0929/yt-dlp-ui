user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # DNS 解析器
    resolver 8.8.8.8 114.114.114.114 valid=30s;
    resolver_timeout 30s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 120M;
    client_body_timeout 300s;

    # ===================== 主站（根域名和 www）=====================
    server {
        listen 80;
        server_name blackwing.icu www.blackwing.icu;

        # 默认首页
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ===================== 前端静态页面 =====================
        location /fuel/ {
            alias /usr/share/nginx/html/fuel/;
            index index.html;
            try_files $uri $uri/ /fuel/index.html;
        }

        # ===================== Food 前端静态页面 =====================
        location /food/ {
            alias /usr/share/nginx/html/food/;
            index index.html;
            try_files $uri $uri/ /food/index.html;

            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }
        }

        # ===================== 图片处理 API =====================
        location /api/images {
            proxy_pass http://192.168.2.100:9290;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_set_header Expect "";
            proxy_http_version 1.1;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            client_body_buffer_size 256k;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ===================== 油价 API 代理 =====================
        location = /index.php {
            proxy_pass https://you.qswpt.com/index.php$is_args$args;
            proxy_set_header Host you.qswpt.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_buffering off;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location @proxy_index {
            proxy_pass https://you.qswpt.com$request_uri;
            proxy_set_header Host you.qswpt.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_buffering off;
        }

        # ===================== 城市油价 API 代理 =====================
        location ^~ /wxapp/ {
            proxy_pass https://data.shiciwenji.com/wxapp/;
            proxy_set_header Host data.shiciwenji.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_buffering off;
        }

        location @proxy_wxapp {
            proxy_pass https://data.shiciwenji.com$request_uri;
            proxy_set_header Host data.shiciwenji.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_buffering off;
        }

        # ===================== Blog 前端静态（主站路径）=====================
        location /blog/ {
            alias /usr/share/nginx/html/blog/;
            index index.html;
            try_files $uri $uri/ /blog/index.html;

            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            }
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }
        }

        # ===================== Blog API 代理 =====================
        location ~ ^/api/blog {
            proxy_pass http://192.168.2.100:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffering off;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        }

        # ===================== 通用 API 代理 =====================
        location ~ ^/api/(?!blog)(?!images) {
            proxy_pass http://192.168.2.100:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffering off;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE';
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header Access-Control-Allow-Credentials true;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # ===================== Blog WebSocket 代理 =====================
        location /blog/ws {
            proxy_pass http://192.168.2.100:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # ===================== WebSocket 代理 =====================
        location /ws {
            proxy_pass http://192.168.2.100:8001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # ===================== Blog 上传文件代理 =====================
        location /blog/uploads/ {
            proxy_pass http://192.168.2.100:8080/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_connect_timeout 300s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            send_timeout 600s;
            client_body_timeout 600s;

            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
        }

        # ===================== 上传文件代理 =====================
        location /uploads/ {
            proxy_pass http://192.168.2.100:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_connect_timeout 300s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            send_timeout 600s;
            client_body_timeout 600s;

            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
        }
    }

    # ===================== Blog 子域名 =====================
    server {
        listen 80;
        server_name blog.blackwing.icu;

        root /usr/share/nginx/html/blog;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location /api/ {
            proxy_pass http://192.168.2.100:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ===================== 油价查询子域名 =====================
    server {
        listen 80;
        server_name fuel.blackwing.icu;

        root /usr/share/nginx/html/fuel;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        location = /index.php {
            proxy_pass https://you.qswpt.com/index.php$is_args$args;
            proxy_set_header Host you.qswpt.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_buffering off;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location ^~ /wxapp/ {
            proxy_pass https://data.shiciwenji.com/wxapp/;
            proxy_set_header Host data.shiciwenji.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_buffering off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
    }

    # ===================== Food 子域名 =====================
    server {
        listen 80;
        server_name food.blackwing.icu;

        root /usr/share/nginx/html/food;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Food API 代理
        location /api/ {
            proxy_pass http://192.168.2.100:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ===================== 视频下载子域名 =====================
    server {
        listen 80;
        server_name video.blackwing.icu;

        client_max_body_size 1M;

        location / {
            proxy_pass http://192.168.2.100:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 下载进度通过 SSE 返回，必须关闭代理缓存和响应缓冲。
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            add_header X-Accel-Buffering "no" always;

            # 解析、下载以及浏览器接收文件可能持续较长时间。
            proxy_connect_timeout 30s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            send_timeout 3600s;
        }
    }
}
