services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: frame-get-api:latest
    container_name: frame-get-api
    expose:
      - "3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      YTDLP_TEMP_DIR: /tmp/yt-dlp-ui
      YTDLP_TASK_TTL: "${YTDLP_TASK_TTL:-3600}"
      YTDLP_MAX_WORKERS: "${YTDLP_MAX_WORKERS:-4}"
    # Media exists only while yt-dlp/ffmpeg is processing or the browser has
    # not fetched it yet. Successful transfers are deleted immediately.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${YTDLP_TMPFS_SIZE:-4g},uid=10001,gid=10001,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 20s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: frame-get-web:latest
    container_name: frame-get
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-3000}:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: frame-get-internal-network
